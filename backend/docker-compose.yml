services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: weave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - weave-postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weave-postgres-data:
